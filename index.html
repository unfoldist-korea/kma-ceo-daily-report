<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KMA 경조사·인사 모니터</title>
<style>
  :root{
    --bg:#f5f6f8; --card:#fff; --line:#e3e6ea; --ink:#1b1f24; --dim:#5b6472;
    --obit:#c0392b; --obit-bg:#fdf1f0; --obit-line:#f0c8c3;
    --hire:#1a5fb4; --hire-bg:#eef4fc; --hire-line:#c3d6f0;
    --warn:#8a5a00; --warn-bg:#fff6e0; --warn-line:#f0dca8;
    --kma:#0d7a4f; --kma-bg:#eefaf3;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"Pretendard","Malgun Gothic","맑은 고딕",system-ui,-apple-system,sans-serif;
    font-size:18px; line-height:1.65;
    -webkit-text-size-adjust:100%;
  }
  .wrap{max-width:900px; margin:0 auto; padding:20px 16px 64px}

  header h1{font-size:25px; margin:0 0 6px; letter-spacing:-.4px}
  .meta{color:var(--dim); font-size:16px; display:flex; flex-wrap:wrap; gap:6px 16px}
  .meta b{color:var(--ink); font-weight:600}

  .alert{
    margin:14px 0 0; padding:13px 15px; border-radius:10px; font-size:17px;
    background:var(--warn-bg); border:1px solid var(--warn-line); color:var(--warn);
  }
  .alert b{color:#6b4500}

  .controls{
    display:flex; gap:10px; flex-wrap:wrap; align-items:center;
    margin:20px 0 8px; padding:14px; background:var(--card);
    border:1px solid var(--line); border-radius:12px;
  }
  .controls label{font-size:16px; color:var(--dim); display:flex; align-items:center; gap:8px}
  select,input[type=search]{
    font:inherit; font-size:17px; padding:9px 12px; min-height:44px;
    border:1px solid var(--line); border-radius:8px; background:#fff; color:var(--ink);
  }
  input[type=search]{flex:1; min-width:190px}
  select:focus,input:focus{outline:2px solid #4a90d9; outline-offset:1px}

  section{margin-top:26px}
  h2{
    font-size:20px; margin:0 0 10px; display:flex; align-items:center;
    gap:9px; flex-wrap:wrap; letter-spacing:-.3px;
  }
  h2 .count{font-size:15px; font-weight:500; color:var(--dim)}
  .section-note{font-size:15px; color:var(--dim); margin:-4px 0 10px}

  .hero h2{font-size:22px}
  .hero{
    background:var(--kma-bg); border:2px solid var(--kma);
    border-radius:14px; padding:18px 16px 16px;
  }
  .hero h2{color:var(--kma)}

  ul.items{list-style:none; margin:0; padding:0; display:grid; gap:9px}

  li.item{
    background:var(--card); border:1px solid var(--line); border-left-width:5px;
    border-radius:10px; padding:13px 15px;
  }
  li.obit{border-left-color:var(--obit)}
  li.hire{border-left-color:var(--hire)}

  .row1{display:flex; align-items:baseline; gap:9px; flex-wrap:wrap}
  .name{font-size:19px; font-weight:700}
  .tag{
    font-size:14px; font-weight:600; padding:3px 9px; border-radius:999px;
    white-space:nowrap; line-height:1.4;
  }
  .tag.obit{background:var(--obit-bg); color:var(--obit); border:1px solid var(--obit-line)}
  .tag.hire{background:var(--hire-bg); color:var(--hire); border:1px solid var(--hire-line)}
  .tag.kma{background:var(--kma); color:#fff}
  .tag.check{background:var(--warn-bg); color:var(--warn); border:1px solid var(--warn-line)}
  .tag.former{background:#eceff3; color:var(--dim); border:1px solid var(--line)}

  .affil{font-size:17px; color:var(--ink); margin-top:3px}
  .affil .pos{color:var(--dim)}
  .title{font-size:16px; color:var(--dim); margin-top:4px}

  .row2{
    display:flex; gap:8px 14px; flex-wrap:wrap; align-items:center;
    margin-top:8px; font-size:15px; color:var(--dim);
  }
  .row2 a{color:var(--hire); text-decoration:none; font-weight:600; padding:2px 0}
  .row2 a:hover{text-decoration:underline}

  /* 이름까지 맞으면 초록(DB 일치), 회사만 맞으면 노랑(확인 필요) */
  .matched{
    font-size:15px; margin-top:7px; line-height:1.6;
    border-radius:7px; padding:7px 10px;
  }
  .matched.hit{color:var(--kma); background:#eefaf3; border:1px solid #bfe6d2}
  .matched.check{color:var(--warn); background:var(--warn-bg); border:1px solid var(--warn-line)}
  .matched b{font-weight:700}
  .matched u{text-decoration:underline; text-underline-offset:3px; font-weight:700}
  .matched .dim{opacity:.75; font-weight:400}

  .empty{
    background:var(--card); border:1px dashed var(--line); border-radius:10px;
    padding:18px 15px; color:var(--dim); font-size:16px; text-align:center;
  }
  footer{margin-top:40px; font-size:15px; color:var(--dim); text-align:center; line-height:1.8}

  /* 비밀번호 잠금 화면 */
  #lock{
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    background:var(--bg); padding:20px; z-index:50;
  }
  #lock[hidden]{display:none}
  .lock-box{
    width:100%; max-width:390px; background:var(--card); border:1px solid var(--line);
    border-radius:14px; padding:28px 24px; text-align:center;
  }
  .lock-box h1{font-size:21px; margin:0 0 8px}
  .lock-note{color:var(--dim); font-size:16px; margin:0 0 18px}
  #lockInput{
    width:100%; font:inherit; font-size:17px; padding:12px 14px; min-height:48px;
    border:1px solid var(--line); border-radius:9px; text-align:center; letter-spacing:.5px;
  }
  #lockBtn{
    width:100%; margin-top:10px; font:inherit; font-size:17px; font-weight:600;
    min-height:48px; border:0; border-radius:9px; background:var(--hire); color:#fff; cursor:pointer;
  }
  #lockBtn:disabled{background:#9db4d2; cursor:default}
  .lock-msg{color:var(--dim); font-size:15px; margin:14px 0 0; min-height:1.4em}

  /* 휴대폰 — 글씨를 한 단계 낮추되 입력칸은 16px 아래로 내리지 않는다 */
  @media (max-width:760px){
    body{font-size:16.5px}
    .wrap{padding:16px 14px 56px}
    header h1{font-size:21px}
    .meta{font-size:15px; gap:4px 12px}
    h2{font-size:18.5px}
    .hero h2{font-size:19.5px}
    .name{font-size:17.5px}
    .affil{font-size:16px}
    .title,.row2,.matched,.section-note{font-size:14.5px}
    select,input[type=search]{font-size:16px}
    .controls{padding:12px; gap:8px}
    .controls label{width:100%}
    select{flex:1}
  }
</style>
</head>
<body>

<div id="lock">
  <div class="lock-box">
    <h1>KMA 경조사·인사 모니터</h1>
    <p class="lock-note">사내 공유용 화면입니다. 비밀번호를 넣어 주세요.</p>
    <input id="lockInput" type="password" placeholder="비밀번호" autocomplete="current-password" spellcheck="false">
    <button id="lockBtn" type="button">열기</button>
    <p id="lockMsg" class="lock-msg">한 번 넣으면 이 기기에서는 다시 묻지 않습니다.</p>
  </div>
</div>

<div class="wrap" hidden>

  <header>
    <h1>KMA 경조사·인사 모니터</h1>
    <div class="meta">
      <span>보는 날짜 <b id="viewDate">-</b></span>
      <span>마지막 수집 <b id="lastRun">-</b></span>
    </div>
    <div id="alerts"></div>
  </header>

  <div class="controls">
    <label for="dateSelect">날짜</label>
    <select id="dateSelect"></select>
    <input id="search" type="search" placeholder="회사명 또는 이름으로 검색" autocomplete="off">
  </div>

  <section class="hero" id="kmaSection"></section>
  <section id="obitSection"></section>
  <section id="hireSection"></section>

  <footer>
    한국경제 · 매일경제 · 서울경제 인사·부고 코너를 평일 하루 3회(08시·13시·18시) 모아 보여줍니다.<br>
    원문 저작권은 각 언론사에 있으며, 이 화면은 제목과 링크만 보여줍니다.
  </footer>
</div>

<script>
(function () {
  'use strict';

  var RAW = JSON.parse(document.getElementById('payload').textContent);
  var DATA = null;
  var days = {};
  var dateList = [];

  var $ = function (id) { return document.getElementById(id); };

  function esc(s) {
    return String(s == null ? '' : s)
      .split('&').join('&amp;')
      .split('<').join('&lt;')
      .split('>').join('&gt;')
      .split('"').join('&quot;');
  }

  function prettyDate(d) {
    if (!d) return '-';
    var p = d.split('-');
    var names = ['일', '월', '화', '수', '목', '금', '토'];
    var w = names[new Date(d + 'T00:00:00+09:00').getDay()];
    return p[0] + '년 ' + Number(p[1]) + '월 ' + Number(p[2]) + '일 (' + w + ')';
  }

  /* 수집 실패 경고 */
  function renderAlerts() {
    var box = $('alerts');
    var st = DATA.status || {};
    var failed = (st.sources || []).filter(function (s) { return !s.ok; });
    if (!failed.length) { box.innerHTML = ''; return; }
    box.innerHTML = failed.map(function (s) {
      return '<div class="alert"><b>' + esc(s.name) + ' 수집 실패</b> — ' +
             esc(s.error || '원인 미상') +
             '<br>그 언론사 소식이 빠져 있을 수 있습니다.</div>';
    }).join('');
  }

  function itemHtml(it) {
    var isObit = it.category === '부고';
    var cls = isObit ? 'obit' : 'hire';

    var firstTitle = (it.sources && it.sources[0] && it.sources[0].title) || '';

    var head = isObit
      ? (it.personName || '이름 미상')
      : ((it.orgs && it.orgs.length) ? it.orgs.join(' · ') : firstTitle);

    var tags = [];
    if (isObit && it.obitType) tags.push('<span class="tag obit">' + esc(it.obitType) + '</span>');
    if (!isObit) tags.push('<span class="tag hire">인사</span>');
    if (it.isArticle) tags.push('<span class="tag former">기사</span>');
    if (it.isFormer) tags.push('<span class="tag former">전직</span>');
    if (it.kma && it.kma.status === 'DB일치') tags.push('<span class="tag kma">● DB 일치</span>');
    else if (it.kma && it.kma.status === '확인필요') tags.push('<span class="tag check">확인 필요</span>');

    var affil = '';
    if (isObit && it.affiliationRaw) {
      affil = '<div class="affil">' + (it.isFormer ? '전 ' : '') + esc(it.company || it.affiliationRaw) +
              (it.position ? ' <span class="pos">' + esc(it.position) + '</span>' : '') + '</div>';
    }

    var links = (it.sources || []).map(function (s) {
      return '<a href="' + esc(s.url) + '" target="_blank" rel="noopener">' + esc(s.name) + ' 원문 ↗</a>';
    }).join('');

    // 우리 경영자 DB 에 그 회사의 '누가' 들어 있는지 보여준다.
    // 기사 속 인물 본인인지, 같은 회사의 다른 임직원인지 바로 판단할 수 있어야 한다.
    // 우리 경영자 DB 에 그 회사의 '누가' 들어 있는지 이름까지 보여준다.
    // 기사 속 인물 본인인지, 같은 회사의 다른 임직원인지 한눈에 판단할 수 있어야 한다.
    var matched = '';
    if (it.kma && it.kma.matched && it.kma.matched.length) {
      var isHit = it.kma.status === 'DB일치';
      var rows = it.kma.matched.slice(0, 3).map(function (m) {
        var shown = (m.people || []).slice(0, 5).map(function (p) {
          var label = [p.position, p.name].filter(Boolean).join(' ') || '이름·직위 미기재';
          var same = p.name && it.personName &&
                     p.name.replace(/\s/g, '') === String(it.personName).replace(/\s/g, '');
          return same ? '<u>' + esc(label) + '</u>' : esc(label);
        });
        var extra = (m.peopleCount > shown.length) ? ' 외 ' + (m.peopleCount - shown.length) + '명' : '';
        var prog = (m.programs || []).filter(Boolean).slice(0, 3).join(', ');

        return '경영자 DB 內 <b>' + esc(m.name) + '</b> — ' + shown.join(', ') + esc(extra) +
               (prog ? ' <span class="dim">· ' + esc(prog) + '</span>' : '');
      });
      matched = '<div class="matched ' + (isHit ? 'hit' : 'check') + '">' + rows.join('<br>') + '</div>';
    }

    return '<li class="item ' + cls + '">' +
      '<div class="row1"><span class="name">' + esc(head) + '</span>' + tags.join('') + '</div>' +
      affil +
      (head === firstTitle ? '' : '<div class="title">' + esc(firstTitle) + '</div>') +
      matched +
      '<div class="row2"><span>' + esc(it.publishedAt || it.date || '') + '</span>' + links + '</div>' +
      '</li>';
  }

  function listHtml(items, emptyText) {
    if (!items.length) return '<div class="empty">' + esc(emptyText) + '</div>';
    return '<ul class="items">' + items.map(itemHtml).join('') + '</ul>';
  }

  function matches(it, q) {
    if (!q) return true;
    var hay = [
      it.personName, it.company, it.position, it.affiliationRaw, it.obitType,
      (it.orgs || []).join(' '),
      (it.sources || []).map(function (s) { return s.title + ' ' + s.name; }).join(' ')
    ].join(' ').toLowerCase();
    return hay.indexOf(q.toLowerCase()) !== -1;
  }

  /** 고른 날짜로부터 뒤로 n일 안에 있는 KMA 관련 소식을 모은다 */
  function recentKma(fromDate, n) {
    var out = [];
    for (var i = 0; i < dateList.length; i++) {
      var d = dateList[i];
      if (d > fromDate) continue;
      var gap = Math.round((new Date(fromDate) - new Date(d)) / 86400000);
      if (gap > n) break;
      var hits = (days[d] || []).filter(function (it) { return it.kma && it.kma.status; });
      out = out.concat(hits);
      if (out.length >= 12) break;
    }
    return out;
  }

  function render() {
    var date = $('dateSelect').value;
    var q = $('search').value.trim();
    var items = (days[date] || []).filter(function (it) { return matches(it, q); });

    $('viewDate').textContent = prettyDate(date);
    $('lastRun').textContent = (DATA.status && DATA.status.lastRunAt) || '-';

    // 이름까지 맞은 'DB일치' 를 위로 올린다
    var kma = items.filter(function (it) { return it.kma && it.kma.status; })
      .sort(function (a, b) {
        var pa = a.kma.status === 'DB일치' ? 0 : 1;
        var pb = b.kma.status === 'DB일치' ? 0 : 1;
        return pa - pb;
      });
    var rest = items.filter(function (it) { return !(it.kma && it.kma.status); });
    var obit = rest.filter(function (it) { return it.category === '부고'; });
    var hire = rest.filter(function (it) { return it.category !== '부고'; });

    var kmaNote = (DATA.status && DATA.status.kmaDbAvailable)
      ? ''
      : '<div class="section-note">아직 KMA DB 엑셀을 넣지 않아 대조를 못 했습니다.</div>';

    // 고른 날짜에 KMA 건이 없으면, 최근 7일 안에 있었던 것을 대신 보여준다
    var recentHtml = '';
    if (!kma.length && !q) {
      var recent = recentKma(date, 7);
      if (recent.length) {
        recentHtml =
          '<div class="section-note" style="margin-top:12px">이 날짜에는 없습니다. 최근 7일 안의 KMA 관련 소식 ' +
          recent.length + '건입니다.</div>' + listHtml(recent, '');
      }
    }

    $('kmaSection').innerHTML =
      '<h2>오늘의 KMA 관련 소식 <span class="count">' + kma.length + '건</span></h2>' +
      kmaNote +
      (kma.length
        ? listHtml(kma, '')
        : (recentHtml || listHtml([], q ? '검색 결과가 없습니다.' : 'KMA DB와 겹치는 소식이 없습니다.')));

    $('obitSection').innerHTML =
      '<h2>오늘의 부고 <span class="count">' + obit.length + '건</span></h2>' +
      listHtml(obit, q ? '검색 결과가 없습니다.' : '이 날짜에 등록된 부고가 없습니다.');

    $('hireSection').innerHTML =
      '<h2>오늘의 인사 <span class="count">' + hire.length + '건</span></h2>' +
      listHtml(hire, q ? '검색 결과가 없습니다.' : '이 날짜에 등록된 인사가 없습니다.');
  }

  /* 날짜 목록 채우기 */
  /** 자료를 받아 화면을 띄운다 */
  function start(data) {
    DATA = data;
    days = DATA.days || {};
    dateList = Object.keys(days).sort().reverse();

    var sel = $('dateSelect');
    sel.innerHTML = dateList.map(function (d) {
      return '<option value="' + d + '">' + prettyDate(d) + ' (' + (days[d] || []).length + '건)</option>';
    }).join('');
    if (!dateList.length) sel.innerHTML = '<option>자료 없음</option>';

    sel.addEventListener('change', render);
    $('search').addEventListener('input', render);

    document.getElementById('lock').hidden = true;
    document.querySelector('.wrap').hidden = false;

    renderAlerts();
    render();
  }

  /* ─────────── 비밀번호 잠금 ───────────
     인터넷에 올라가는 파일에는 자료가 암호로 잠긴 채 들어 있다.
     비밀번호를 넣으면 '이 브라우저 안에서' 풀어서 보여준다.
     비밀번호는 어디로도 전송되지 않는다. */

  var STORE_KEY = 'kma-watch-pw';

  function fromBase64(s) {
    var bin = atob(s);
    var out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }

  function decrypt(password) {
    var enc = new TextEncoder();
    return crypto.subtle
      .importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey'])
      .then(function (material) {
        return crypto.subtle.deriveKey(
          { name: 'PBKDF2', salt: fromBase64(RAW.salt), iterations: RAW.iterations, hash: 'SHA-256' },
          material,
          { name: 'AES-GCM', length: 256 },
          false,
          ['decrypt']
        );
      })
      .then(function (key) {
        return crypto.subtle.decrypt({ name: 'AES-GCM', iv: fromBase64(RAW.iv) }, key, fromBase64(RAW.data));
      })
      .then(function (buf) {
        return JSON.parse(new TextDecoder().decode(buf));
      });
  }

  function tryPassword(password, remember) {
    var msg = document.getElementById('lockMsg');
    var btn = document.getElementById('lockBtn');
    msg.textContent = '여는 중…';
    btn.disabled = true;

    return decrypt(password)
      .then(function (data) {
        if (remember) { try { localStorage.setItem(STORE_KEY, password); } catch (e) {} }
        start(data);
      })
      .catch(function () {
        try { localStorage.removeItem(STORE_KEY); } catch (e) {}
        msg.textContent = '비밀번호가 맞지 않습니다.';
        btn.disabled = false;
        document.getElementById('lockInput').select();
      });
  }

  if (!RAW.encrypted) {
    start(RAW);
  } else if (!window.crypto || !crypto.subtle) {
    document.getElementById('lockMsg').textContent =
      '이 브라우저에서는 열 수 없습니다. 인터넷 주소(https)로 열어 주세요.';
  } else {
    var saved = null;
    try { saved = localStorage.getItem(STORE_KEY); } catch (e) {}

    document.getElementById('lockBtn').addEventListener('click', function () {
      tryPassword(document.getElementById('lockInput').value.trim(), true);
    });
    document.getElementById('lockInput').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') tryPassword(this.value.trim(), true);
    });

    if (saved) tryPassword(saved, true);
    else document.getElementById('lockInput').focus();
  }
})();
</script>
</body>
</html>
